<section class = "filter">
<button
  type="button"
  class="filters__btn"
  [ngClass]="{ 'is-active': filter === 'all' }"
  (click)="setFilter('all')"
>
  Все
</button>
<button
  type="button"
  class="filters__btn"
  [ngClass]="{ 'is-active': filter === 'liked' }"
  (click)="setFilter('liked')"
>
  Избранное 
</button>
<button
  type="button"
  class="filters__btn"
  [ngClass]="{ 'is-active': filter === 'special' }"
  (click)="setFilter('special')"
>
  Спецпроекты
</button>
<button
  type="button"
  class="filters__btn"
  [ngClass]="{ 'is-active': filter === 'podcast' }"
  (click)="setFilter('podcast')"
>
  Подкасты
</button>
</section>

  <section class="cards" *ngIf="filteredItems.length > 0; else empty"
    >
  <div class="card-wrap"
       *ngFor="let item of filteredItems"
       [ngStyle]="{
      'box-shadow': item.liked
        ? '0 12px 30px rgba(0,0,0,0.15)'
        : '0 8px 20px rgba(0,0,0,0.08)',
      'transform': item.liked ? 'scale(1.02)' : 'scale(1)',
      'transition': '0.3s'
       
    }"
       >

  <app-course-card
    [id]="item.id"
    [title]="item.title"
    [image]="item.image"
    [desc]="item.desc"
    [type]="item.type"
    [liked]="item.liked"
    (likedChange)="item.liked = $event"
  ></app-course-card>
  </div>
   </section>
<ng-template #empty>
  <p class="empty">По этому фильтру пока ничего нет.</p>
</ng-template>
