<article class="card"
        (mouseenter)="isHovered = true"
  (mouseleave)="isHovered = false"
  [style.transform]="isHovered ? 'translateY(-2px)' : 'translateY(0)'"
  [style.boxShadow]="isHovered
    ? '0 16px 34px rgba(0, 0, 0, 0.12)'
    : '0 10px 28px rgba(0, 0, 0, 0.08)'"
  (click)="onCardClick()"
          
         [class.card--special]="type === 'special'"
         [attr.data-type]="type"
         (click)="onCardClick()">

  <img class="card__img" [src]="image" [alt]="title" />

  <button class="card__like" type="button" (click)="toggleLike($event)">
    <img [src]="liked ? 'hearto.png' : 'heartf.png'" alt="like">
  </button>

  <div class="card__body">
    <span class="card__pill" *ngIf="type === 'special'">Спецпроект</span>
    <h3 class="card__title">{{ title }}</h3>
    <p class="card__desc">{{ desc }}</p>
  </div>
</article>
