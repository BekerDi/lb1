<article
  class="card"
  [class.card--special]="course.type === 'special'"
  [routerLink]="course.type === 'special' ? ['/spec-page', course.id] : null"
>
  <img class="card__img" [src]="course.image" [alt]="course.title" />
  <button class="card__like" (click)="toggleLike($event)">
  <img
    [src]="course.liked ? 'hearto.png' : 'heartf.png'"
    alt="like"
  >
</button>

  <div class="card__body">
    <span class="card__pill" *ngIf="course.type === 'special'">
      Спецпроект
    </span>

    <h3 class="card__title">{{ course.title }}</h3>
    <p class="card__desc">{{ course.desc }}</p>
  </div>
</article>
